version: "3.9"

services:
  postgres:
    # Includes pgvector so migration 004 can create the required extension on
    # an empty development database without a manual superuser step.
    image: pgvector/pgvector:pg16
    container_name: ococ-user-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ococ_users
      POSTGRES_USER: ococ
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ococ -d ococ_users"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ococ-user-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: ococ-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/ococ_users
      KC_DB_USERNAME: ococ
      KC_DB_PASSWORD: root
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_PORT: 8180
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ococ-user-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDR: "0.0.0.0:8080"
      DATABASE_URL: "postgres://ococ:root@postgres:5432/ococ_users?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      KEYCLOAK_URL: "http://keycloak:8180"
      KEYCLOAK_REALM: "ococ"
      KEYCLOAK_CLIENT_ID: "user-management"
      KEYCLOAK_CLIENT_SECRET: "change-me-in-production"
      KEYCLOAK_ADMIN_USER: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      RFID_READER_SIMULATE: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      ENVIRONMENT: "development"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ococ-user-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
